<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rep Coach — AI Push-Up & Sit-Up Counter</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rep Coach">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #05070d;
  --ink-2: #0a101c;
  --panel: #0c1220;
  --panel-2: #101a2b;
  --line: #1c2940;
  --line-strong: #2a3f5f;
  --signal: #2f6fed;
  --signal-bright: #5b93ff;
  --pulse: #34d3ee;
  --paper: #e8eef8;
  --mute: #7e8fa8;
  --faint: #4c5b73;

  --font-ui: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Space Mono', 'SF Mono', 'Roboto Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  background: radial-gradient(ellipse 120% 60% at 50% -10%, #101d33 0%, var(--ink) 55%);
  color: var(--paper);
  font-family: var(--font-ui);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

button, select, input { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--pulse);
  outline-offset: 2px;
}

#app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  gap: 12px;
}

/* ---------- header ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 2px 0;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-icon {
  color: var(--pulse);
  filter: drop-shadow(0 0 6px rgba(52, 211, 238, 0.6));
  flex-shrink: 0;
}

.brand-title {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.01em;
  line-height: 1.1;
}

.brand-sub {
  font-size: 11.5px;
  color: var(--mute);
  line-height: 1.2;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--mute);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.icon-btn:active { background: var(--panel-2); color: var(--paper); }

/* ---------- settings panel ---------- */
.settings-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 4px 14px;
}
.settings-panel.hidden { display: none; }

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  gap: 12px;
}
.settings-row:last-child { border-bottom: none; }
.settings-row.column { flex-direction: column; align-items: stretch; gap: 8px; }
.settings-row.column > span { color: var(--paper); }

.pill-group { display: flex; gap: 8px; }

.pill {
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  color: var(--paper);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}
.pill:active { border-color: var(--signal-bright); }

#voiceSelect {
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  color: var(--paper);
  border-radius: 10px;
  padding: 9px 10px;
  font-size: 13px;
  width: 100%;
}

.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  border-radius: 999px; transition: background 0.15s, border-color 0.15s;
}
.slider::before {
  content: ""; position: absolute; width: 18px; height: 18px;
  left: 3px; top: 50%; transform: translateY(-50%);
  background: var(--mute); border-radius: 50%; transition: transform 0.15s, background 0.15s;
}
.switch input:checked + .slider { background: rgba(47,111,237,0.25); border-color: var(--signal); }
.switch input:checked + .slider::before { transform: translate(18px, -50%); background: var(--signal-bright); }

/* ---------- mode tabs ---------- */
.mode-tabs {
  display: flex;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px;
  gap: 4px;
}
.tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--mute);
  padding: 10px 0;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  transition: background 0.15s, color 0.15s;
}
.tab.active {
  background: linear-gradient(135deg, var(--signal), #4577e0);
  color: #fff;
  box-shadow: 0 2px 12px rgba(47,111,237,0.35);
}

/* ---------- camera stage ---------- */
#cameraStage {
  position: relative;
  flex: 1;
  min-height: 340px;
  border-radius: 22px;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  box-shadow: 0 0 0 1px rgba(47,111,237,0.08), 0 18px 40px -20px rgba(47,111,237,0.5);
}

#mirror {
  position: absolute;
  inset: 0;
  transition: transform 0.2s;
}

#video, #overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#video { background: var(--panel); }

.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--faint);
  text-align: center;
  padding: 0 30px;
}
.placeholder p { margin: 0; font-size: 13.5px; color: var(--mute); }
.placeholder.hidden { display: none; }

.badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(6,10,18,0.72);
  border: 1px solid var(--line-strong);
  backdrop-filter: blur(6px);
  color: var(--pulse);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.06em;
  padding: 6px 12px;
  border-radius: 999px;
}
.badge.hidden { display: none; }

.live-dot {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(6,10,18,0.72);
  border: 1px solid var(--line-strong);
  backdrop-filter: blur(6px);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 6px 10px 6px 8px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.live-dot span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--pulse);
  box-shadow: 0 0 8px var(--pulse);
  animation: livepulse 1.4s ease-in-out infinite;
}
.live-dot.hidden { display: none; }

.paused-banner {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(5,7,13,0.62);
  backdrop-filter: blur(2px);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.12em;
  color: var(--paper);
}
.paused-banner.hidden { display: none; }

@keyframes livepulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.75); }
}
@media (prefers-reduced-motion: reduce) {
  .live-dot span { animation: none; }
}

/* ---------- counter ---------- */
#counterPanel {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2px 0 0;
}
#repCount {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 76px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--paper);
  text-shadow: 0 0 26px rgba(52,211,238,0.45);
}
#repCount.pulse { animation: countpulse 0.32s ease-out; }
@keyframes countpulse {
  0% { transform: scale(1.14); color: var(--pulse); }
  100% { transform: scale(1); color: var(--paper); }
}
@media (prefers-reduced-motion: reduce) {
  #repCount.pulse { animation: none; }
}
#repLabel {
  font-size: 13px;
  color: var(--mute);
  font-weight: 500;
  margin-top: 2px;
}

/* ---------- controls ---------- */
#controls { display: flex; gap: 10px; }

.ctrl {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 15px;
  border: 1px solid transparent;
  transition: opacity 0.15s, transform 0.08s;
}
.ctrl:active { transform: scale(0.97); }
.ctrl:disabled { opacity: 0.32; pointer-events: none; }

.ctrl.primary {
  background: linear-gradient(135deg, var(--signal), #4f86ff);
  color: #fff;
  box-shadow: 0 10px 24px -10px rgba(47,111,237,0.7);
}
.ctrl.secondary {
  background: transparent;
  border-color: var(--signal);
  color: var(--signal-bright);
}
.ctrl.tertiary {
  background: var(--panel-2);
  border-color: var(--line-strong);
  color: var(--mute);
}

.status-msg {
  min-height: 16px;
  text-align: center;
  font-size: 12.5px;
  color: var(--signal-bright);
  margin: 0;
}

.tip {
  text-align: center;
  font-size: 11.5px;
  color: var(--faint);
  margin: 0;
  padding-bottom: 2px;
}

</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="4.6" r="2.2"/>
        <path d="M12 7.5v5.2l-4 3.3M12 12.7l4.2 3.3M8 12h8"/>
      </svg>
      <div>
        <div class="brand-title">Rep Coach</div>
        <div class="brand-sub">AI rep counter</div>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1.09-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-row">
      <span>Voice feedback</span>
      <label class="switch">
        <input type="checkbox" id="voiceToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="settings-row">
      <span>Quick voice pick</span>
      <div class="pill-group">
        <button id="femaleVoiceBtn" class="pill" type="button">Woman</button>
        <button id="maleVoiceBtn" class="pill" type="button">Man</button>
      </div>
    </div>
    <div class="settings-row column">
      <span>Voice</span>
      <select id="voiceSelect"></select>
    </div>
    <div class="settings-row">
      <span>Camera</span>
      <button id="flipCameraBtn" class="pill" type="button">Flip camera</button>
    </div>
  </div>

  <nav class="mode-tabs" role="tablist">
    <button class="tab active" data-mode="pushup" role="tab" aria-selected="true" type="button">Push-Up</button>
    <button class="tab" data-mode="situp" role="tab" aria-selected="false" type="button">Sit-Up</button>
  </nav>

  <div id="cameraStage">
    <div id="mirror">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="placeholder" class="placeholder">
      <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2.5"/>
      </svg>
      <p>Tap Start to turn on your camera</p>
    </div>

    <div id="phaseBadge" class="badge hidden">READY</div>
    <div id="liveDot" class="live-dot hidden"><span></span>LIVE</div>
    <div id="pausedBanner" class="paused-banner hidden">PAUSED</div>
  </div>

  <div id="counterPanel">
    <div id="repCount">0</div>
    <div id="repLabel">Push-Ups</div>
  </div>

  <div id="controls">
    <button id="startBtn" class="ctrl primary" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span class="btn-label">Start</span>
    </button>
    <button id="pauseBtn" class="ctrl secondary" type="button" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      Pause
    </button>
    <button id="stopBtn" class="ctrl tertiary" type="button" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
      Stop
    </button>
  </div>

  <p id="statusMsg" class="status-msg"></p>
  <p class="tip">Keep your full body in frame with good, even lighting for the most accurate count.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2/dist/pose-detection.min.js"></script>
<script>
"use strict";

/* ---------------- Tunable detection parameters ---------------- */
const MIN_SCORE = 0.35;            // minimum keypoint confidence to trust a joint
const SMOOTHING_FRAMES = 5;        // frames averaged to smooth angle noise
const CONFIRM_FRAMES = 3;          // consecutive frames required to confirm a position change
const MIN_REP_INTERVAL_MS = 400;   // minimum time between counted reps (debounce)

const EXERCISES = {
  pushup: {
    label: "Push-Ups",
    voiceName: "push up",
    restAngle: 155,   // arm considered extended above this angle
    peakAngle: 100,   // arm considered bent below this angle
    restLabel: "UP",
    peakLabel: "DOWN",
    jointSets: [
      ["left_shoulder", "left_elbow", "left_wrist"],
      ["right_shoulder", "right_elbow", "right_wrist"],
    ],
  },
  situp: {
    label: "Sit-Ups",
    voiceName: "sit up",
    restAngle: 140,
    peakAngle: 90,
    restLabel: "DOWN",
    peakLabel: "UP",
    jointSets: [
      ["left_shoulder", "left_hip", "left_knee"],
      ["right_shoulder", "right_hip", "right_knee"],
    ],
  },
};

/* ---------------- DOM references ---------------- */
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const mirrorEl = document.getElementById("mirror");
const placeholderEl = document.getElementById("placeholder");
const phaseBadge = document.getElementById("phaseBadge");
const pausedBanner = document.getElementById("pausedBanner");
const liveDot = document.getElementById("liveDot");
const repCountEl = document.getElementById("repCount");
const repLabelEl = document.getElementById("repLabel");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");
const statusMsg = document.getElementById("statusMsg");
const tabs = Array.from(document.querySelectorAll(".tab"));
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const voiceToggle = document.getElementById("voiceToggle");
const voiceSelect = document.getElementById("voiceSelect");
const femaleVoiceBtn = document.getElementById("femaleVoiceBtn");
const maleVoiceBtn = document.getElementById("maleVoiceBtn");
const flipCameraBtn = document.getElementById("flipCameraBtn");
const ctx = overlay.getContext("2d");

/* ---------------- App state ---------------- */
let mode = "pushup";
let phase = "idle"; // idle | initializing | running | paused
let facing = "user";
let stream = null;
let detector = null;
let modelReady = false;
let rafId = null;
let wakeLock = null;

const rep = {
  reps: 0,
  stage: "rest",
  candidateStage: "rest",
  candidateCount: 0,
  angleBuffer: [],
  lastRepTime: 0,
};

/* ---------------- Utility ---------------- */
function angleBetween(a, b, c) {
  const abx = a.x - b.x, aby = a.y - b.y;
  const cbx = c.x - b.x, cby = c.y - b.y;
  const magAB = Math.hypot(abx, aby);
  const magCB = Math.hypot(cbx, cby);
  if (magAB === 0 || magCB === 0) return null;
  let cosA = (abx * cbx + aby * cby) / (magAB * magCB);
  cosA = Math.min(1, Math.max(-1, cosA));
  return (Math.acos(cosA) * 180) / Math.PI;
}

function findKp(keypoints, name) {
  for (let i = 0; i < keypoints.length; i++) {
    if (keypoints[i].name === name) return keypoints[i];
  }
  return null;
}

function setStatus(msg) {
  statusMsg.textContent = msg || "";
}

/* ---------------- Voice ---------------- */
let voices = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const current = voiceSelect.value;
  voiceSelect.innerHTML = "";
  voices.forEach((v) => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name + " (" + v.lang + ")";
    voiceSelect.appendChild(opt);
  });
  const stillExists = voices.some((v) => v.name === current);
  if (stillExists) {
    voiceSelect.value = current;
  } else {
    const en = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
    voiceSelect.value = (en || voices[0]).name;
  }
}
if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function speak(text, interrupt) {
  if (!voiceToggle.checked) return;
  if (!("speechSynthesis" in window)) return;
  if (interrupt) window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const chosen = voices.find((v) => v.name === voiceSelect.value);
  if (chosen) utter.voice = chosen;
  utter.rate = 1.05;
  window.speechSynthesis.speak(utter);
}

function pickVoiceByGender(gender) {
  const hints = gender === "female"
    ? ["female", "woman", "samantha", "victoria", "karen", "moira", "tessa", "fiona", "zira", "susan", "allison", "ava", "serena", "kate", "salli", "joanna"]
    : ["male", "man", "daniel", "alex", "fred", "david", "mark", "tom", "james", "arthur", "oliver", "aaron", "matthew"];
  return voices.find((v) => hints.some((h) => v.name.toLowerCase().includes(h)));
}

femaleVoiceBtn.addEventListener("click", () => {
  const v = pickVoiceByGender("female");
  if (v) {
    voiceSelect.value = v.name;
    speak("Woman voice selected", true);
  } else {
    setStatus("No clearly-labeled woman's voice on this device — pick one from the list below.");
  }
});
maleVoiceBtn.addEventListener("click", () => {
  const v = pickVoiceByGender("male");
  if (v) {
    voiceSelect.value = v.name;
    speak("Man voice selected", true);
  } else {
    setStatus("No clearly-labeled man's voice on this device — pick one from the list below.");
  }
});

/* ---------------- Rep detection ---------------- */
function getPrimaryAngle(keypoints, exercise) {
  let sum = 0, n = 0;
  for (const [an, bn, cn] of exercise.jointSets) {
    const a = findKp(keypoints, an), b = findKp(keypoints, bn), c = findKp(keypoints, cn);
    if (a && b && c && a.score > MIN_SCORE && b.score > MIN_SCORE && c.score > MIN_SCORE) {
      const ang = angleBetween(a, b, c);
      if (ang !== null) { sum += ang; n++; }
    }
  }
  return n ? sum / n : null;
}

function resetRepState() {
  rep.reps = 0;
  rep.stage = "rest";
  rep.candidateStage = "rest";
  rep.candidateCount = 0;
  rep.angleBuffer = [];
  rep.lastRepTime = 0;
  repCountEl.textContent = "0";
}

function processFrame(keypoints) {
  const exercise = EXERCISES[mode];
  const raw = getPrimaryAngle(keypoints, exercise);
  if (raw === null) {
    phaseBadge.textContent = "…";
    return;
  }

  rep.angleBuffer.push(raw);
  if (rep.angleBuffer.length > SMOOTHING_FRAMES) rep.angleBuffer.shift();
  const smoothed = rep.angleBuffer.reduce((s, v) => s + v, 0) / rep.angleBuffer.length;

  let candidate = null;
  if (smoothed >= exercise.restAngle) candidate = "rest";
  else if (smoothed <= exercise.peakAngle) candidate = "peak";

  if (candidate) {
    if (candidate === rep.candidateStage) rep.candidateCount++;
    else { rep.candidateStage = candidate; rep.candidateCount = 1; }
  } else {
    rep.candidateCount = 0;
  }

  if (candidate && rep.candidateCount >= CONFIRM_FRAMES && candidate !== rep.stage) {
    const prevStage = rep.stage;
    rep.stage = candidate;
    if (prevStage === "rest" && rep.stage === "peak") {
      const now = performance.now();
      if (now - rep.lastRepTime > MIN_REP_INTERVAL_MS) {
        rep.lastRepTime = now;
        rep.reps++;
        onRepCounted(rep.reps);
      }
    }
  }

  phaseBadge.textContent = rep.stage === "peak" ? exercise.peakLabel : exercise.restLabel;
}

function onRepCounted(count) {
  repCountEl.textContent = String(count);
  repCountEl.classList.remove("pulse");
  void repCountEl.offsetWidth;
  repCountEl.classList.add("pulse");
  let phrase = String(count);
  if (count > 0 && count % 10 === 0) phrase += ". Great work, keep going";
  speak(phrase, true);
}

/* ---------------- Skeleton drawing ---------------- */
const EDGES = [
  ["left_shoulder", "right_shoulder"],
  ["left_shoulder", "left_elbow"], ["left_elbow", "left_wrist"],
  ["right_shoulder", "right_elbow"], ["right_elbow", "right_wrist"],
  ["left_shoulder", "left_hip"], ["right_shoulder", "right_hip"],
  ["left_hip", "right_hip"],
  ["left_hip", "left_knee"], ["left_knee", "left_ankle"],
  ["right_hip", "right_knee"], ["right_knee", "right_ankle"],
  ["nose", "left_shoulder"], ["nose", "right_shoulder"],
];

function resizeCanvas() {
  const w = video.videoWidth, h = video.videoHeight;
  if (w && h && (overlay.width !== w || overlay.height !== h)) {
    overlay.width = w;
    overlay.height = h;
  }
}

function clearOverlay() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
}

function drawSkeleton(keypoints) {
  clearOverlay();
  ctx.lineWidth = Math.max(3, overlay.width * 0.008);
  ctx.strokeStyle = "rgba(56,189,248,0.95)";
  ctx.shadowColor = "rgba(34,211,238,0.9)";
  ctx.shadowBlur = 10;
  ctx.lineCap = "round";

  for (const [an, bn] of EDGES) {
    const a = findKp(keypoints, an), b = findKp(keypoints, bn);
    if (a && b && a.score > MIN_SCORE && b.score > MIN_SCORE) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  ctx.shadowBlur = 0;
  const r = Math.max(4, overlay.width * 0.012);
  for (const p of keypoints) {
    if (p.score > MIN_SCORE) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = "#eaf1fb";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = "#2563eb";
      ctx.fill();
    }
  }
}

/* ---------------- Camera ---------------- */
async function startCamera(nextFacing) {
  stopCameraStream();
  const constraints = {
    video: { facingMode: nextFacing, width: { ideal: 720 }, height: { ideal: 1280 } },
    audio: false,
  };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await video.play();
  facing = nextFacing;
  mirrorEl.style.transform = facing === "user" ? "scaleX(-1)" : "none";
  resizeCanvas();
}

function stopCameraStream() {
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
}

flipCameraBtn.addEventListener("click", async () => {
  if (phase === "idle") { setStatus("Start the camera first, then you can flip it."); return; }
  const next = facing === "user" ? "environment" : "user";
  try {
    await startCamera(next);
  } catch (e) {
    setStatus("Couldn't switch camera on this device.");
  }
});

/* ---------------- Model ---------------- */
async function initModel() {
  if (modelReady) return;
  if (typeof tf === "undefined" || typeof poseDetection === "undefined") {
    throw new Error("The AI engine failed to load. Check your internet connection and reload the page.");
  }
  await tf.setBackend("webgl");
  await tf.ready();
  detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
    modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
  });
  modelReady = true;
}

/* ---------------- Main loop ---------------- */
async function loop() {
  if ((phase === "running" || phase === "paused") && modelReady && detector && video.readyState >= 2) {
    try {
      const poses = await detector.estimatePoses(video, { flipHorizontal: false });
      resizeCanvas();
      if (poses && poses[0] && poses[0].keypoints) {
        drawSkeleton(poses[0].keypoints);
        if (phase === "running") processFrame(poses[0].keypoints);
      } else {
        clearOverlay();
      }
    } catch (e) {
      /* ignore transient per-frame errors so the loop never dies mid-session */
    }
  }
  rafId = requestAnimationFrame(loop);
}

/* ---------------- Wake lock (keep screen on mid-workout) ---------------- */
async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { /* not fatal */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && phase === "running") acquireWakeLock();
  if (document.visibilityState === "hidden" && phase === "running") doPause(true);
});

/* ---------------- Phase / UI transitions ---------------- */
function updateButtons() {
  startBtn.disabled = phase === "running" || phase === "initializing";
  pauseBtn.disabled = phase !== "running";
  stopBtn.disabled = phase === "idle" || phase === "initializing";
  startBtn.querySelector(".btn-label").textContent = phase === "paused" ? "Resume" : "Start";
}

function updatePresence() {
  const camOn = phase === "running" || phase === "paused";
  placeholderEl.classList.toggle("hidden", camOn);
  phaseBadge.classList.toggle("hidden", !camOn);
  liveDot.classList.toggle("hidden", phase !== "running");
  pausedBanner.classList.toggle("hidden", phase !== "paused");
}

async function doStart() {
  if (phase === "paused") {
    phase = "running";
    updateButtons(); updatePresence();
    setStatus("");
    speak("Resumed", true);
    acquireWakeLock();
    return;
  }
  phase = "initializing";
  updateButtons();
  setStatus("Loading AI model…");
  try {
    await initModel();
    await startCamera(facing);
    resetRepState();
    repLabelEl.textContent = EXERCISES[mode].label;
    phase = "running";
    setStatus("");
    updateButtons(); updatePresence();
    speak("Starting " + EXERCISES[mode].voiceName + " count", true);
    acquireWakeLock();
  } catch (e) {
    phase = "idle";
    updateButtons(); updatePresence();
    setStatus((e && e.message) || "Couldn't start the camera. Please allow camera access and try again.");
  }
}

function doPause(silent) {
  if (phase !== "running") return;
  phase = "paused";
  updateButtons(); updatePresence();
  if (!silent) speak("Paused", true);
}

function doStop() {
  if (phase === "idle") return;
  const finalCount = rep.reps;
  const label = EXERCISES[mode].label.toLowerCase();
  phase = "idle";
  stopCameraStream();
  clearOverlay();
  releaseWakeLock();
  updateButtons(); updatePresence();
  setStatus("Session complete — " + finalCount + " " + label + ".");
  speak("Workout stopped. You completed " + finalCount + " " + label, true);
}

startBtn.addEventListener("click", doStart);
pauseBtn.addEventListener("click", () => doPause(false));
stopBtn.addEventListener("click", doStop);

/* ---------------- Mode tabs ---------------- */
tabs.forEach((tab) => {
  tab.addEventListener("click", () => {
    if (tab.dataset.mode === mode) return;
    tabs.forEach((t) => { t.classList.remove("active"); t.setAttribute("aria-selected", "false"); });
    tab.classList.add("active");
    tab.setAttribute("aria-selected", "true");
    mode = tab.dataset.mode;
    resetRepState();
    repLabelEl.textContent = EXERCISES[mode].label;
    phaseBadge.textContent = EXERCISES[mode].restLabel;
    if (phase === "running") speak(EXERCISES[mode].voiceName + " mode", true);
  });
});

/* ---------------- Settings panel ---------------- */
settingsBtn.addEventListener("click", () => {
  settingsPanel.classList.toggle("hidden");
});

/* ---------------- Service worker (enables install / offline shell) ---------------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------------- Init ---------------- */
window.addEventListener("resize", resizeCanvas);
repLabelEl.textContent = EXERCISES[mode].label;
updateButtons();
updatePresence();
loop();

</script>
</body>
</html>
